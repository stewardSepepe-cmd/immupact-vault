name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Uses package-lock.json when it is committed; falls back to npm install otherwise.
      - run: npm ci || npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run check
      - run: npm test
